name: Backend Continuous Integration

# Automatically triggered on pull requests to main, only for backend changes.
# Can also be run manually (on-demand).
on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  # Working directory for all backend commands
  BACKEND_DIR: starter/backend

jobs:
  # ---------------------------------------------------------------------------
  # LINT JOB - runs in parallel with the test job
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            pipenv-${{ runner.os }}-

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pipenv install --dev

      - name: Run lint
        working-directory: ${{ env.BACKEND_DIR }}
        run: pipenv run lint

  # ---------------------------------------------------------------------------
  # TEST JOB - runs in parallel with the lint job
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pipenv virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            pipenv-${{ runner.os }}-

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pipenv install --dev

      - name: Run tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: pipenv run test

  # ---------------------------------------------------------------------------
  # BUILD JOB - only runs after lint AND test succeed (needs directive)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ env.BACKEND_DIR }}
        run: docker build --tag mp-backend:latest .